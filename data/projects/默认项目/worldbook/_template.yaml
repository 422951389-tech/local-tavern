# 世界书条目模板 — 复制改名后填内容
# 世界书 = 关键词触发的背景设定库
# AI 输出时，prompt 中会自动注入匹配的条目

# 唯一标识
id: world_entry_id

# 触发关键词（逗号分隔，任一匹配即触发）
keys:
  - 关键词1
  - 关键词2

# 是否每次必注入（true = 无视关键词，永远在 prompt 里）
constant: false

# 插入位置（before / after = 插在角色卡前/后）
position: after

# 条目内容（实际注入到 prompt 的文本）
content: |
  这里写世界的背景设定。
  例如地点、势力、规则、历史、术语解释等。
  越具体，AI 越不会乱编。
