# 用户档案模板 — 复制改名后填内容
# 描述"我"是谁，玩家的身份设定

id: user_id

# 用户名（你在场景里被怎么称呼）
name: 用户名

# 身份 / 角色设定
identity: |
  你的身份、背景、能力等。
  例如：失去记忆的神秘共鸣者，拥有初觉醒的超维感知。

# 当前状态（结构化字段）
status:
  condition: 身体状态（轻度虚弱 / 健康等）
  abilities:
    - 已获得的能力

# 初始场景元数据
scene_meta:
  location: 起始地点
  time: 时间 / 天气
  main_quest: 主线任务名
  current_scene: 当前场景描述
  next_goal: 下一步目标
