# 角色卡字段模板 — 复制此文件，改名为你的角色 ID.yaml，再填内容

# 唯一标识（文件名用这个，代码里靠这个引用）
id: char_id

# 显示名
name: 角色名

# 可触发世界书关键词的别名（每行一个）
aliases:
  - 角色别名

# 一句话定位（30 字内）
tagline: 角色的核心特征

# 详细人设（300-1000 字）
persona: |
  填写角色的性格、背景、动机、说话方式、习惯动作等。
  这是 AI 理解"这个人是谁"的核心。

# 外貌（结构化字段，方便程序按字段注入）
appearance:
  hair: 发型与发色
  eyes: 眼型与瞳色
  outfit: 穿着
  features: 其他显著特征

# 语气 / 句式偏好（直接影响 AI 模仿）
voice_tone: 整体语调（轻声细语 / 大大咧咧 / 冷淡等）
speaking_style: |
  描述这个角色怎么说话。
  例如：句末常带"呢""嗯"，爱用省略号，喜欢自言自语。

# 示范台词（3-5 句，给 AI 学说话节奏用）
catchphrases:
  - "台词1"
  - "台词2"
  - "台词3"

# 能力 / 技能（可选）
abilities:
  - 能力1
  - 能力2

# 与其他角色的关系（id → 关系描述）
relationships:
  other_char_id: 关系描述

# AI 生成状态卡时的初始默认值
initial_stats:
  affinity: 0          # 好感度 0-100
  mood: 平静           # 初始情绪
  posture: 站立        # 初始姿势

# 是否默认出场（true = 开局就出现在场景里）
active: true
