<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地酒馆</title>
    <link rel="stylesheet" href="/static/style.css?v=search1-20260722">
</head>
<body>
    <!-- 顶栏 v3：世界观做主标题，下属 4 tab -->
    <header id="topbar" aria-label="项目与对话工具">
        <!-- 左：项目（世界观） -->
        <div class="topbar-group project-group">
            <button id="project-btn" class="project-btn" type="button" title="切换项目（世界观）"
                aria-label="切换项目（世界观）" aria-haspopup="listbox"
                aria-controls="project-list" aria-expanded="false">
                <span class="ico" aria-hidden="true">📁</span>
                <span id="project-name">加载中…</span>
                <span class="caret" aria-hidden="true">▾</span>
            </button>
            <span id="project-stats" class="project-stats"></span>
        </div>

        <!-- 中：4 个 tab（角色 / 世界书 / 用户 / 存档） -->
        <div class="topbar-group tabs-group" role="toolbar" aria-label="世界观编辑工具">
            <button class="tab-btn" data-tab="chars" id="tab-chars" type="button"
                title="角色卡（当前世界观的演员）" aria-label="编辑角色卡"
                aria-haspopup="dialog" aria-controls="modal">
                <span class="ico" aria-hidden="true">👥</span><span class="lbl">角色</span>
            </button>
            <button class="tab-btn" data-tab="world" id="tab-world" type="button"
                title="世界书（当前世界观的设定）" aria-label="编辑世界书"
                aria-haspopup="dialog" aria-controls="modal">
                <span class="ico" aria-hidden="true">📖</span><span class="lbl">世界书</span>
            </button>
            <button class="tab-btn" data-tab="user" id="tab-user" type="button"
                title="用户档案（当前世界的观众设定）" aria-label="编辑用户档案"
                aria-haspopup="dialog" aria-controls="modal">
                <span class="ico" aria-hidden="true">👤</span><span class="lbl">用户</span>
            </button>
            <div class="tab-btn tab-save-wrap" id="tab-save-wrap">
                <button class="tab-btn save-tab" data-tab="saves" id="tab-saves" type="button"
                    title="存档（当前世界观下的演出录像）" aria-label="切换存档"
                    aria-haspopup="listbox" aria-controls="save-list" aria-expanded="false">
                    <span class="ico" aria-hidden="true">💾</span><span class="lbl">存档</span>
                    <span class="badge" id="save-count">0</span>
                    <span class="caret" aria-hidden="true">▾</span>
                </button>
            </div>
        </div>

        <!-- 右：模型 + 工具 -->
        <div class="topbar-group tools-group">
            <select id="model-select" title="切换模型" aria-label="对话模型">
                <option value="">加载中…</option>
            </select>
            <button id="reset-btn" class="icon-btn" type="button" title="重置当前存档内容"
                aria-label="重置当前存档内容"><span aria-hidden="true">↺</span></button>
            <button id="model-params-btn" class="icon-btn" type="button" title="调 AI 参数"
                aria-label="调整 AI 参数" aria-haspopup="dialog" aria-controls="modal"><span aria-hidden="true">🎛</span></button>
            <button id="history-btn" class="icon-btn" type="button" title="查看历史快照"
                aria-label="查看历史快照" aria-haspopup="dialog" aria-controls="modal"><span aria-hidden="true">🕐</span></button>
            <button id="search-btn" class="icon-btn" type="button" title="全局剧情搜索"
                aria-label="全局剧情搜索" aria-haspopup="dialog" aria-controls="modal"><span aria-hidden="true">🔎</span></button>
            <button id="prompts-btn" class="icon-btn" type="button" title="编辑提示词"
                aria-label="编辑提示词" aria-haspopup="dialog" aria-controls="modal"><span aria-hidden="true">📝</span></button>
        </div>

    </header>

    <!-- 项目下拉面板（点击 📁 弹出） -->
    <div id="project-dropdown" class="dropdown-panel hidden" aria-labelledby="project-btn">
        <div id="project-list" class="dropdown-list" role="listbox" aria-label="项目列表" tabindex="-1"></div>
        <div class="dropdown-footer">
            <button id="project-new-inline" class="dropdown-action" type="button" aria-label="新建项目">➕ 新建项目</button>
        </div>
    </div>

    <!-- 存档下拉面板（点击 💾 弹出） -->
    <div id="save-dropdown" class="dropdown-panel hidden" aria-labelledby="tab-saves">
        <div id="save-list" class="dropdown-list" role="listbox" aria-label="存档列表" tabindex="-1"></div>
        <div class="dropdown-footer">
            <button id="save-new-inline" class="dropdown-action" type="button">➕ 新建存档</button>
            <button id="save-rename-inline" class="dropdown-action" type="button">✎ 重命名</button>
            <button id="save-delete-inline" class="dropdown-action" type="button">🗑 删除</button>
            <button id="save-export-inline" class="dropdown-action" type="button">📤 导出</button>
            <button id="save-import-inline" class="dropdown-action" type="button">📥 导入</button>
        </div>
    </div>

    <!-- 场景元数据条 -->
    <div id="scene-meta" class="scene-meta">
        <div class="scene-row">
            <span id="meta-location">📍 等待场景初始化…</span>
        </div>
        <div class="scene-row sub">
            <span id="meta-quest"></span>
            <span id="meta-goal"></span>
        </div>
        <div class="scene-row sub">
            <span id="meta-user"></span>
        </div>
    </div>

    <!-- 主区 -->
    <main id="main">
        <!-- 对话流 -->
        <section id="chat-stream" class="chat-stream" aria-label="对话记录">
            <div class="welcome" id="welcome">
                <p>👋 欢迎使用本地酒馆</p>
                <p>选择一个项目开始冒险，点击右上角「重置」初始化场景</p>
            </div>
        </section>

        <!-- 角色状态侧栏 -->
        <aside id="character-panel" class="character-panel" aria-label="角色状态与禁言">
            <h3>角色状态与禁言</h3>
            <div id="character-list">
                <p class="empty">无角色数据</p>
            </div>
        </aside>
    </main>

    <!-- 行动建议 -->
    <div id="suggestions" class="suggestions"></div>

    <!-- 底栏：输入 -->
    <footer id="input-bar">
        <textarea
            id="user-input"
            placeholder="输入你的行动或对话…(Shift+Enter 换行，Enter 发送)"
            aria-label="对话输入"
            rows="2"
        ></textarea>
        <button id="send-btn" type="button">发送</button>
        <button id="send-cancel-btn" class="hidden" type="button" title="取消生成" aria-label="取消生成"><span aria-hidden="true">⏹</span> 取消</button>
    </footer>
    <div id="app-status" class="sr-only" role="status" aria-live="polite"></div>

    <!-- Thinking 折叠面板 -->
    <div id="thinking-panel" class="thinking-panel hidden" role="region" aria-labelledby="thinking-title">
        <div class="thinking-header">
            <span id="thinking-title"><span aria-hidden="true">💭</span> AI 思考中…</span>
            <button id="thinking-close" type="button" aria-label="收起 AI 思考面板" aria-controls="thinking-panel">收起</button>
        </div>
        <div id="thinking-content" class="thinking-content"></div>
    </div>

    <script src="/static/security.js?v=phase-a-sec-20260712"></script>
    <script src="/static/api-client.js?v=fe1-20260715"></script>
    <script src="/static/session-ref.js?v=fe1-20260715"></script>
    <script src="/static/turn-client.js?v=fe1-20260715"></script>
    <script type="module" src="/static/app.mjs?v=search1-20260722"></script>

    <!-- 通用 Modal 容器 -->
    <div id="modal-backdrop" class="modal-backdrop hidden" aria-hidden="true">
        <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-error" tabindex="-1">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button id="modal-close" class="modal-close" type="button" aria-label="关闭对话框">×</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
            <div id="modal-error" class="modal-error hidden" role="alert" aria-live="assertive"></div>
            <div id="modal-footer" class="modal-footer hidden">
                <button id="modal-cancel" class="modal-btn" type="button">取消</button>
                <button id="modal-confirm" class="modal-btn primary" type="button">确定</button>
            </div>
        </div>
    </div>
</body>
</html>
